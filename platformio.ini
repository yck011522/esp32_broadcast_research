; Interactive E2 motor commissioning firmware; no motion on startup.
[platformio]
default_envs = master_radio

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = seeed_xiao_esp32s3
framework = arduino
build_flags = -DCORE_DEBUG_LEVEL=0 ; Silence diagnostics
monitor_speed = 115200
monitor_dtr = 1
monitor_rts = 0

[ota_settings_home]
build_flags =
    '-D WIFI_SSID="LUN2.4G"'
    '-D WIFI_PASSWORD="60834578"'
    -D GATEWAY_ADDRESS=192,168,1,1
    -D STATIC_IP_ADDRESS=192,168,1,200

[ota_settings_lab]
build_flags =
    '-D WIFI_SSID="M7026 Lab Router"'
    '-D WIFI_PASSWORD="70267026"'
    -D GATEWAY_ADDRESS=192,168,50,1
    -D STATIC_IP_ADDRESS=192,168,50,200


[env:master_radio]
build_src_filter = -<*> +<master_radio/>

; Test 6: same OTA-enabled slave firmware, but flashed over USB.
; Use this ONLY for the first flash (and for recovery if OTA fails):
[env:slave_radio_2]
build_src_filter = -<*> +<slave_radio/>
build_flags =
    -D CAR_ID=2
    '-D OTA_HOSTNAME="slave_radio_2"'
    '-D OTA_PASSWORD="ota7026"'

; Test 6: OTA-enabled slave, static IP on the offline lab router.
[env:slave_radio_2_home]
extends = env:slave_radio_2
upload_protocol = espota
upload_port = 192.168.1.200
upload_flags = --auth=ota7026
build_flags =
    ${ota_settings_home.build_flags}
    ${env:slave_radio_2.build_flags}

[env:slave_radio_2_lab]
extends = env:slave_radio_2
upload_protocol = espota
upload_port = 192.168.50.200
upload_flags = --auth=ota7026
build_flags =
    ${ota_settings_lab.build_flags}
    ${env:slave_radio_2.build_flags}

[env:slave_radio_2_home_usb]
extends = env:slave_radio_2
build_flags =
    ${ota_settings_home.build_flags}
    ${env:slave_radio_2.build_flags}
