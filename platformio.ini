; Interactive E2 motor commissioning firmware; no motion on startup.
[platformio]
default_envs = master_radio_broadcast

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = seeed_xiao_esp32s3
framework = arduino
build_flags = -DCORE_DEBUG_LEVEL=0 ; Silence diagnostics
monitor_speed = 115200
monitor_dtr = 1
monitor_rts = 0

[ota_settings_lab]
build_flags =
    '-D WIFI_SSID="M7026 Lab Router 2G"'
    '-D WIFI_PASSWORD="70267026"'
    -D GATEWAY_ADDRESS=192,168,0,1
    -D STATIC_IP_ADDRESS=192,168,0,100


; [env:master_radio]
; build_src_filter = -<*> +<legacy/espnow/master_radio/>

[env:master_radio_broadcast]
build_src_filter = -<*> +<legacy/espnow/master_radio_broadcast/>

[env:ble_slave]
build_src_filter = -<*> +<ble_slave/>
build_flags =
    -D BLE_DEVICE_ID=1

[env:ble_server]
build_src_filter = -<*> +<test_11/ble_server/>
upload_port = COM3

; Test 11: one firmware source, separate advertised identity for each car.
; Car 1 retains the original service UUID. Car 2/3 upload ports are selected
; automatically, or specify --upload-port COMx when flashing each board.
[env:ble_server_car_1]
build_src_filter = -<*> +<test_11/ble_server/>
build_flags = ${env.build_flags} -D BLE_CAR_ID=1
upload_port = COM3

[env:ble_server_car_2]
build_src_filter = -<*> +<test_11/ble_server/>
build_flags = ${env.build_flags} -D BLE_CAR_ID=2

[env:ble_server_car_3]
build_src_filter = -<*> +<test_11/ble_server/>
build_flags = ${env.build_flags} -D BLE_CAR_ID=3

[env:ble_client]
build_src_filter = -<*> +<test_09/ble_client/>
upload_port = COM4

; Test 12: separate NimBLE-Arduino firmware, no motor control.
[env:ble_test12_car_1]
build_src_filter = -<*> +<test_12/car/>
lib_deps = h2zero/NimBLE-Arduino@2.5.1
build_flags = ${env.build_flags} -D BLE_CAR_ID=1
upload_port = COM3

[env:ble_test12_car_2]
extends = env:ble_test12_car_1
build_flags = ${env.build_flags} -D BLE_CAR_ID=2
upload_port = COM4

[env:ble_test12_car_3]
extends = env:ble_test12_car_1
build_flags = ${env.build_flags} -D BLE_CAR_ID=3
upload_port = COM5

; Test 13: ESP32 USB/BLE modem and two car peripherals. No motor outputs.
[env:esp_esp_ble_modem]
build_src_filter = -<*> +<test_13/esp_esp_ble_modem/>
lib_deps = h2zero/NimBLE-Arduino@2.5.1
build_flags = ${env.build_flags} -I src/test_13/include -include src/test_13/include/esp_esp_ble_modem_config.h
upload_port = COM3

[env:esp_esp_ble_car]
build_src_filter = -<*> +<test_13/esp_esp_ble_car/>
lib_deps = h2zero/NimBLE-Arduino@2.5.1
build_flags = ${env.build_flags} -I src/test_13/include -D BLE_CAR_ID=2
upload_port = COM4

[env:esp_esp_ble_car_2]
extends = env:esp_esp_ble_car

[env:esp_esp_ble_car_3]
extends = env:esp_esp_ble_car
build_flags = ${env.build_flags} -I src/test_13/include -D BLE_CAR_ID=3
upload_port = COM5

; Temporary pure-idle BLE diagnostics. Restore normal car profiles afterward.
[env:ble_server_car_1_idle_probe]
extends = env:ble_server_car_1
build_flags = ${env:ble_server_car_1.build_flags} -D BLE_COMMAND_WATCHDOG_ENABLED=0

[env:ble_server_car_2_idle_probe]
extends = env:ble_server_car_2
build_flags = ${env:ble_server_car_2.build_flags} -D BLE_COMMAND_WATCHDOG_ENABLED=0

[env:ble_server_car_3_idle_probe]
extends = env:ble_server_car_3
build_flags = ${env:ble_server_car_3.build_flags} -D BLE_COMMAND_WATCHDOG_ENABLED=0


; Test 6: same OTA-enabled slave firmware, but flashed over USB.
; Use this ONLY for the first flash (and for recovery if OTA fails):
[env:slave_radio_1]
build_src_filter = -<*> +<legacy/espnow/slave_radio/>
build_flags =
    -D CAR_ID=1
    '-D OTA_HOSTNAME="slave_radio_1"'
    '-D OTA_PASSWORD="ota7026"'

[env:slave_radio_2]
build_src_filter = -<*> +<legacy/espnow/slave_radio/>
build_flags =
    -D CAR_ID=2
    '-D OTA_HOSTNAME="slave_radio_2"'
    '-D OTA_PASSWORD="ota7026"'

[env:slave_radio_2_lab]
extends = env:slave_radio_2
upload_protocol = espota
upload_port = 192.168.0.102
upload_flags = --auth=ota7026
build_flags =
    ${ota_settings_lab.build_flags}
    ${env:slave_radio_2.build_flags}

[env:slave_radio_1_lab_usb]
extends = env:slave_radio_1
build_flags =
    ${ota_settings_lab.build_flags}
    ${env:slave_radio_1.build_flags}

[env:slave_radio_2_lab_usb]
extends = env:slave_radio_2
build_flags =
    ${ota_settings_lab.build_flags}
    ${env:slave_radio_2.build_flags}
