; Interactive E2 motor commissioning firmware; no motion on startup.
[platformio]
default_envs = master_radio

[env]
platform = espressif32@6.12.0
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0

[env:master_radio]
build_src_filter = -<*> +<master_radio/>

[env:slave_radio]
build_src_filter = -<*> +<slave_radio/>

; Test 6: master fixed to Wi-Fi channel 6 to match the lab router.
[env:master_radio_ota]
build_src_filter = -<*> +<master_radio_ota/>

; Test 6: OTA-enabled slave, static IP on the offline lab router.
; Upload over Wi-Fi with: pio run -e slave_radio_ota -t upload
[env:slave_radio_ota]
build_src_filter = -<*> +<slave_radio_ota/>
upload_protocol = espota
upload_port = 192.168.50.200
upload_flags = --auth=ota7026

; Test 6: same OTA-enabled slave firmware, but flashed over USB.
; Use this ONLY for the first flash (and for recovery if OTA fails):
;   pio run -e slave_radio_ota_usb -t upload --upload-port COM10
[env:slave_radio_ota_usb]
build_src_filter = -<*> +<slave_radio_ota/>