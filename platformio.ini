; Interactive E2 motor commissioning firmware; no motion on startup.
[platformio]
default_envs = master_radio

[env]
platform = espressif32@6.12.0
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0

[env:master_radio]
build_src_filter = -<*> +<master_radio/>

[env:slave_radio]
build_src_filter = -<*> +<slave_radio/>